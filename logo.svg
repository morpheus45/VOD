<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -12 300 86" width="300" height="74">
  <defs>
    <linearGradient id="tvG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B3FE0"/>
      <stop offset="100%" stop-color="#38A8E8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Badge sombre derrière PIPSILY -->
  <rect x="0" y="2" width="178" height="68" rx="10" ry="10"
        fill="#07070F" stroke="rgba(255,255,255,0.10)" stroke-width="1.2"/>

  <!-- PIPSILY — Impact blanc dans le badge -->
  <text x="11" y="56"
        font-family="Impact,'Arial Narrow Bold','Arial Black',sans-serif"
        font-weight="900"
        font-size="44"
        fill="#FFFFFF"
        letter-spacing="1.5">PIPSILY</text>

  <!-- TV icon — antenne gauche -->
  <line x1="181" y1="8" x2="172" y2="-8"
        stroke="url(#tvG)" stroke-width="2.8" stroke-linecap="round"/>
  <circle cx="171" cy="-9" r="3.5" fill="#6B3FE0" filter="url(#glow)"/>

  <!-- TV icon — antenne droite -->
  <line x1="219" y1="8" x2="228" y2="-8"
        stroke="url(#tvG)" stroke-width="2.8" stroke-linecap="round"/>
  <circle cx="229" cy="-9" r="3.5" fill="#38A8E8" filter="url(#glow)"/>

  <!-- TV body — outline dégradé, coins très arrondis -->
  <rect x="168" y="6" width="66" height="64" rx="16" ry="16"
        fill="none" stroke="url(#tvG)" stroke-width="3.8" filter="url(#glow)"/>

  <!-- PRO — Impact blanc -->
  <text x="242" y="56"
        font-family="Impact,'Arial Narrow Bold','Arial Black',sans-serif"
        font-weight="900"
        font-size="38"
        fill="#FFFFFF"
        letter-spacing="1">PRO</text>
</svg>
