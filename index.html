<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#08111f"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="PIPSIFLIX"/>
  <title>PIPSIFLIX</title>
  <link rel="manifest" href="manifest.webmanifest"/>
  <link rel="icon" href="icons/icon-192.png" type="image/png"/>
  <link rel="apple-touch-icon" href="icons/icon-192.png"/>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>

  <div class="app">

    <header class="topbar">
      <div class="brand">PIPSIFLIX</div>
      <nav class="tabs">
        <button class="tab tab--active" data-type="vod">🎬 Films</button>
        <button class="tab" data-type="series">📺 Séries</button>
      </nav>
    </header>

    <div class="filters">
      <select id="catSelect"><option value="">Toutes catégories</option></select>
      <input id="searchInput" type="search" placeholder="Rechercher…" autocomplete="off"/>
      <select id="qualSelect">
        <option value="">Toutes qualités</option>
        <option value="4K">4K</option>
        <option value="HD">HD</option>
        <option value="SD">SD</option>
      </select>
      <select id="sortSelect">
        <option value="az">A → Z</option>
        <option value="cat">Catégorie</option>
      </select>
    </div>

    <main class="main">
      <div id="stats" class="stats"></div>
      <div id="grid" class="grid"></div>
      <div id="sentinel" class="sentinel"></div>
      <div id="empty" class="empty" hidden>Aucun résultat.</div>
    </main>

  </div>

  <!-- Panneau séries — FERMÉ par défaut via [hidden] -->
  <div id="panel" class="panel" hidden>
    <div class="panel-inner">
      <div class="panel-head" id="panelHead"></div>
      <div class="panel-body" id="panelBody"></div>
    </div>
  </div>

  <div id="backdrop" class="backdrop" hidden></div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(()=>{});
    }
  </script>

</body>
</html>
