// ══════ UPDATE SYSTEM ════════════════════════════════════════════════════
let _updateUrl='';
let _toastZone=false;

function showUpdateToast(tagName,downloadUrl){
  _updateUrl=downloadUrl;
  $('toast-title').textContent='Mise a jour '+tagName+' disponible !';
  $('toast-sub').textContent='Appuyez sur Installer pour telecharger et mettre a jour';
  const w=$('toast-prog-wrap'); if(w)w.style.display='none';
  const bk=$('toast-btn-ok'); if(bk)bk.textContent='Installer';
  $('update-toast').hidden=false;
  _toastZone=true;
  // Focus on OK button
  qAll('.t-btn').forEach(b=>b.classList.remove('foc'));
  $('toast-btn-ok').classList.add('foc');
}
function hideUpdateToast(){
  $('update-toast').hidden=true;
  _toastZone=false;
}
// Lance (ou relance) le telechargement + installation. Le toast reste affiche.
function startCosmosUpdate(){
  if(!_updateUrl)return;
  const bk=$('toast-btn-ok'); if(bk)bk.textContent='Telechargement...';
  $('toast-sub').textContent='Telechargement... 0%';
  const w=$('toast-prog-wrap'); if(w)w.style.display='block';
  const bar=$('toast-prog-bar'); if(bar)bar.style.width='0%';
  try{window.AndroidBridge?.downloadAndInstall?.(_updateUrl);}catch(e){}
}
// Vérification auto de mise à jour (comme PIPSILY Xstream) : compare version.json
// à la version installée → propose la MAJ dans Cosmos aussi.
async function cosmosCheckUpdate(){
  if(!window.AndroidBridge?.getApkVersion) return;
  try{
    const v=await fetch(GH+'version.json?cb='+Date.now()).then(r=>r.json());
    if(!v||!v.apk_version||!v.apk_url) return;
    const remote=parseInt(v.apk_version,10);
    const local=parseInt(window.AndroidBridge.getApkVersion()||'0',10);
    if(remote>local) showUpdateToast('v'+remote, v.apk_url);
  }catch(e){}
}

// Toast button click (un seul bouton : Installer / Relancer)
$('toast-btn-ok').addEventListener('click',startCosmosUpdate);

window._onUpdateResult=function(data){
  if(!data)return;
  // Mise a jour settings
  qAll('.set-item').forEach(el=>{
    if(el.dataset.action==='update'){
      const d=el.querySelector('.set-desc');
      if(data.upToDate)d.textContent='Application a jour (v'+data.currentVersion+')';
      else d.textContent='v'+data.tagName+' - telechargement en cours...';
    }
  });
  if(!data.upToDate&&data.downloadUrl){
    // AUTO: lance le telechargement + installation directement, sans demander
    _updateUrl=data.downloadUrl;
    $('toast-title').textContent='Mise a jour '+data.tagName+' — installation automatique';
    $('toast-sub').textContent='Telechargement en cours...';
    $('update-toast').hidden=false;
    if(window.AndroidBridge?.downloadAndInstall){
      try{AndroidBridge.downloadAndInstall(data.downloadUrl);}catch{}
    }
  }
};

window._onDownloadProgress=function(pct){
  pct=Math.max(0,Math.min(100,parseInt(pct,10)||0));
  const w=$('toast-prog-wrap'); if(w)w.style.display='block';
  const bar=$('toast-prog-bar'); if(bar)bar.style.width=pct+'%';
  const sub=$('toast-sub'); if(sub)sub.textContent=pct>=100?'Installation...':('Telechargement... '+pct+'%');
  qAll('.set-item').forEach(el=>{
    if(el.dataset.action==='update'){
      const d=el.querySelector('.set-desc');
      if(d)d.textContent=pct>=100?'Installation...':('Telechargement... '+pct+'%');
    }
  });
};
// Alias pour le callback unifie (Xstream + Cosmos)
window.onApkDownloadProgress=window._onDownloadProgress;
// Echec / blocage du telechargement → bouton "Relancer"
window.onApkDownloadFailed=function(reason){
  const sub=$('toast-sub'); if(sub)sub.textContent='Echec : '+(reason||'reessayez');
  const bk=$('toast-btn-ok'); if(bk)bk.textContent='Relancer';
  if(!$('update-toast').hidden){_toastZone=true;qAll('.t-btn').forEach(b=>b.classList.remove('foc'));$('toast-btn-ok').classList.add('foc');}
};

// ══════ INIT ═════════════════════════════════════════════════════════════
// Safety: cache le spinner apres 25s dans tous les cas
setTimeout(()=>{$('loading').hidden=true;},25000);

// Cosmos = interface TV uniquement. Hors TV (mobile/navigateur) → retour Xstream.
(async function(){
  var _isTV = /AndroidTV|GoogleTV|SmartTV/i.test(navigator.userAgent)
           || /\bTV\b/.test(navigator.userAgent)
           || window.PIPSILY_NATIVE === 'android_tv';
  // Hors TV : on reste sur Cosmos UNIQUEMENT si l'utilisateur l'a choisi explicitement.
  var _wantsCosmos = false; try{ _wantsCosmos = localStorage.getItem('pf_theme') === 'cosmos'; }catch(e){}
  if(!_isTV && !_wantsCosmos){ location.replace('./index.html'); return; }
  // Auth identique à VOD : même Supabase, même session partagée (origine commune)
  if(window.PIPSILY_AUTH&&window.PIPSILY_AUTH.authGate){
    try{ const a=await window.PIPSILY_AUTH.authGate(); if(!a) return; }catch(e){}
  }
  loadContent();
  loadApps();
  try{history.pushState({cos:1},'');}catch(e){}  // état "piège" pour capter le Retour matériel
  setTimeout(cosmosCheckUpdate, 2500); // propose la MAJ dans Cosmos aussi
})();

// ══════ APPLICATIONS (etagere style Google TV) ═══════════════════════════
function loadApps(){
  if(!window.AndroidBridge?.getInstalledApps)return;
  try{
    const raw=AndroidBridge.getInstalledApps();
    const arr=JSON.parse(raw||'[]');
    // Mettre en avant les apps populaires si presentes
    const PRIO=['netflix','youtube','primevideo','amazonvideo','disney','spotify','twitch','plex','kodi','molotov','canal','arte','mycanal','deezer','vlc'];
    const score=a=>{const p=(a.pkg||'').toLowerCase();const i=PRIO.findIndex(k=>p.includes(k));return i<0?99:i;};
    arr.sort((a,b)=>score(a)-score(b));
    S.appItems=arr.map(a=>({title:a.label,image:a.img,pkg:a.pkg,isApp:true,banner:a.banner,category:'Application'}));
    if(S.sec==='home'&&S.zone==='hero')renderTabHome(); // rafraichir si au repos
  }catch(e){}
}
