<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#08111f"/>
  <title>Lecteur — PIPSIFLIX</title>
  <link rel="manifest" href="manifest.webmanifest"/>
  <link rel="stylesheet" href="player.css"/>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest" async onerror="console.warn('HLS.js CDN indisponible')"></script>
  <script src="https://cdn.jsdelivr.net/npm/mpegts.js@latest" async onerror="console.warn('MPEG-TS.js CDN indisponible')"></script>
</head>
<body>

  <div class="player">

    <div class="player-top">
      <button id="backBtn" class="icon-btn" type="button">← Retour</button>
      <div class="player-info">
        <div id="playerTitle" class="player-title">Lecture</div>
        <div id="playerSub"   class="player-sub"></div>
      </div>
      <button id="favBtn" class="icon-btn" type="button">♥</button>
    </div>

    <div class="video-wrap">
      <video id="video" playsinline controls autoplay preload="metadata"></video>
      <div id="status" class="status" hidden></div>
    </div>

    <div class="ep-nav" id="epNav">
      <button id="prevBtn" class="ep-btn" type="button" disabled>⏮ Précédent</button>
      <button id="nextBtn" class="ep-btn ep-btn--r" type="button" disabled>Suivant ⏭</button>
    </div>

    <div class="actions">
      <button id="nativeBtn"  class="btn-primary" type="button">▶ Lecture native</button>
      <button id="fsBtn"      type="button">⛶ Plein écran</button>
      <button id="copyBtn"    type="button">⎘ Copier lien</button>
      <button id="vlcBtn"     type="button">VLC</button>
    </div>

    <div class="plot-box">
      <p id="plotText">Aucune description.</p>
    </div>

  </div>

  <script src="player.js"></script>
</body>
</html>
